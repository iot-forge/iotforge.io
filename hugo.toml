baseURL = 'https://iotforge.io/'
languageCode = 'en-us'
title = 'IoT Forge'
mainSections = ['podcasts', 'articles', 'resources']
sectionPagesMenu = 'main'
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[params]
description = "IoT Forge — a community podcast and build-log covering IoT, electronics, and robotics."
heroTitle = "Signal traced from the workbench to your feed."
heroSubtitle = "IoT Forge is a community podcast and build-log — IoT, electronics, and robotics news, hardware projects, and curated sources, shipped by the people who build the things they talk about."

# Add external menu entries
[menu]
[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 10

